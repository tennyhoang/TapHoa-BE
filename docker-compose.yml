services:
  postgres:
    image: postgres:16-alpine
    container_name: taphoa_postgres
    environment:
      POSTGRES_DB: taphoa_db
      POSTGRES_USER: taphoa_user
      POSTGRES_PASSWORD: taphoa_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taphoa_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taphoa.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: taphoa_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: taphoa
      RABBITMQ_DEFAULT_PASS: taphoa_pass

volumes:
  postgres_data:
