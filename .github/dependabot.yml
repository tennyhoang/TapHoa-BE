version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    groups:
      aspnetcore:
        patterns: ["Microsoft.AspNetCore*", "Microsoft.EntityFrameworkCore*"]
      serilog:
        patterns: ["Serilog*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      masstransit:
        patterns: ["MassTransit*"]
      testing:
        patterns: ["xunit*", "Moq*", "FluentAssertions*", "MockQueryable*"]
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
