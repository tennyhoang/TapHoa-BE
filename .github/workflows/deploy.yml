# =============================================================================
# CI/CD Pipeline — TapHoa Backend  (.NET 10 → Render)
# =============================================================================
#
# LUỒNG KIỂM DUYỆT:
#
#   [dev]          push → CI + CD Development (tự động)
#   [staging]      push → CI + CD Staging     (sau khi PR dev→staging merge)
#   [main] PR mở  →       CI only             (build + test check để review)
#   [main] PR merge→      CI + CD Production  (sau khi Leader Approve + Merge)
#
# =============================================================================
# CÀI ĐẶT BẮT BUỘC TRƯỚC KHI SỬ DỤNG
# =============================================================================
#
# A. ĐỔI DEFAULT BRANCH (GitHub → Settings → Branches):
#    Đổi default branch từ 'master' sang 'main'
#
# B. BRANCH PROTECTION RULES (Settings → Branches → Add rule):
#
#    Rule cho nhánh [main]:
#      ✅ Require a pull request before merging
#         └ Require approvals: 1
#      ✅ Require status checks: "CI — Build & Test"
#      ✅ Do not allow bypassing the above settings
#
#    Rule cho nhánh [staging]:
#      ✅ Require a pull request before merging
#      ✅ Require status checks: "CI — Build & Test"
#
# C. GITHUB ENVIRONMENTS (Settings → Environments):
#
#    Tạo 3 environments: development | staging | production
#
#    Environment [production]:
#      ✅ Required reviewers: [GitHub username của Leader]
#      ✅ Deployment branches: chỉ cho phép nhánh 'main'
#
# D. SECRETS CẦN THÊM VÀO TỪNG ENVIRONMENT:
#
#    [development]
#      RENDER_DEPLOY_HOOK = <Deploy Hook URL của Render Dev service>
#
#    [staging]
#      RENDER_DEPLOY_HOOK = <Deploy Hook URL của Render Staging service>
#
#    [production]
#      RENDER_DEPLOY_HOOK = <Deploy Hook URL của Render Production service>
#
#    Cách lấy Deploy Hook URL:
#      Render Dashboard → Service → Settings → Deploy Hook → Create Hook
#
#    Lưu ý: Các biến cấu hình thật của ứng dụng (.NET appsettings) như
#    ConnectionStrings, Jwt__Key, Cloudinary, Email... được quản lý
#    TRỰC TIẾP trong Render Dashboard (Environment → Environment Variables)
#    cho từng service, KHÔNG lưu vào GitHub Secrets.
#
# =============================================================================

name: CI/CD — TapHoa BE

on:
  # Trigger khi push vào 3 nhánh chính
  push:
    branches: [dev, staging, main]

  # Trigger khi có Pull Request nhắm vào staging hoặc main
  # → Chỉ chạy CI (build + test), không deploy
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened]

# Hủy run cũ khi có commit mới trên cùng nhánh/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # JOB 1 — CI: Build & Test (chạy với MỌI trigger)
  # ===========================================================================
  ci:
    name: CI — Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Run tests
        run: |
          dotnet test --no-build -c Release --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: |
            '**/TestResults/*.trx'
            TestResults/**/coverage.cobertura.xml
          retention-days: 7

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' TestResults/**/coverage.cobertura.xml | head -1 | awk '{printf "%.0f", $1 * 100}')
          echo "Line coverage: ${COVERAGE}%"
          if [ "${COVERAGE}" -lt 60 ]; then
            echo "❌ Coverage ${COVERAGE}% is below minimum threshold of 60%"
            exit 1
          fi
          echo "✅ Coverage ${COVERAGE}% meets threshold"


  # ===========================================================================
  # JOB 2 — CD Development: Deploy ngay khi push vào nhánh 'dev'
  # ===========================================================================
  deploy-dev:
    name: CD — Deploy to Development
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: ci
    runs-on: ubuntu-latest
    environment: Development   # Bốc RENDER_DEPLOY_HOOK từ environment 'Development'

    steps:
      - name: Trigger Render deploy — Development
        run: |
          echo "Triggering deploy on Render (Development)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render response: HTTP $HTTP_STATUS"
          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "✅ Deploy triggered — Development"
          else
            echo "❌ Deploy hook failed: HTTP $HTTP_STATUS" && exit 1
          fi


  # ===========================================================================
  # JOB 3 — CD Staging: Deploy khi PR dev→staging được merge
  # ===========================================================================
  deploy-staging:
    name: CD — Deploy to Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: ci
    runs-on: ubuntu-latest
    environment: Staging       # Bốc RENDER_DEPLOY_HOOK từ environment 'Staging'

    steps:
      - name: Trigger Render deploy — Staging
        run: |
          echo "Triggering deploy on Render (Staging)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render response: HTTP $HTTP_STATUS"
          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "✅ Deploy triggered — Staging"
          else
            echo "❌ Deploy hook failed: HTTP $HTTP_STATUS" && exit 1
          fi


  # ===========================================================================
  # JOB 4 — CD Production: Deploy CHỈ khi PR được merge vào 'main'
  # ===========================================================================
  # Cơ chế bảo vệ:
  #   1. Branch protection: không ai push trực tiếp được vào main
  #   2. CI gate: needs: ci — build + test phải xanh
  #   3. Environment protection: Required Reviewers pause job này cho đến
  #      khi Leader vào GitHub Actions UI và bấm Approve
  # ===========================================================================
  deploy-production:
    name: CD — Deploy to Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: Production    # Bốc RENDER_DEPLOY_HOOK từ environment 'Production'

    steps:
      - name: Trigger Render deploy — Production
        run: |
          echo "Triggering deploy on Render (Production)..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}")
          echo "Render response: HTTP $HTTP_STATUS"
          if [[ "$HTTP_STATUS" =~ ^2 ]]; then
            echo "✅ Deploy triggered — Production"
            echo "Commit: ${{ github.sha }}"
            echo "Deployed by: ${{ github.actor }}"
          else
            echo "❌ Deploy hook failed: HTTP $HTTP_STATUS" && exit 1
          fi
